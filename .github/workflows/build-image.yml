name: "Building and Pushing Docker Image"
on:
  workflow_dispatch:   # allows manual triggering from GitHub UI
  push:
    branches:
      - python-app-deployment
    paths:
      - '*.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '/template/**'

env:
  DO_CONNECT_TOKEN: ${{ secrets.DO_CONNECT_TOKEN }} # DigitalOcean API token stored in GitHub Secrets
  REGISTRY: registry.digitalocean.com/smoke
  IMAGE_NAME: python-app
  DO_CLUSTER_NAME: ${{ vars.DO_CLUSTER_NAME }} # DigitalOcean Kubernetes cluster name stored in GitHub Secrets
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install doctl and authenticate
        uses: digitalocean/action-doctl@v2
        with:
          token: $DO_CONNECT_TOKEN

      - name: Build Docker image
        run: |
          docker build -t registry.digitalocean.com/smoke/python-app:${{ github.run_number }} .
      
      - name: Login to DigitalOcean registry
        run: doctl registry login

      - name: Push Docker image
        run: |
          docker push registry.digitalocean.com/smoke/python-app:${{ github.run_number }}

  Deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl and authenticate
        uses: digitalocean/action-doctl@v2
        with:
          token: $DO_CONNECT_TOKEN

      - name: Configure kubectl
        run: |
          echo "Using cluster: $DO_CLUSTER_NAME"
          doctl kubernetes cluster kubeconfig save $DO_CLUSTER_NAME

      - name: Update deployment
        run: |
          kubectl set image deployment/your-deployment \
            your-container=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            -n your-namespace

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/your-deployment -n your-namespace
          kubectl get pods -n your-namespace